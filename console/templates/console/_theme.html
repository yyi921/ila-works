<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc; --accent: #1f5f8b;
    --neg: #b3261e; --warn-bg: #fff6e0; --warn: #7a5300; --total: #f0efe9; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993; --line: #34332f; --accent: #7fb6dc;
            --neg: #f2857c; --warn-bg: #3a2f12; --warn: #f0c96a; --total: #292825; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
           padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
           position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; }
  header .org { color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 140px; }
  .entry { margin: 0 0 22px; }
  .cmd { font-family: var(--mono); color: var(--accent); margin-bottom: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .card h2 { font-size: 15px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 10px; }
  .error { border-color: var(--neg); color: var(--neg); }
  .figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 10px 0; }
  .figure { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .figure .label { color: var(--muted); font-size: 12px; }
  .figure .value { font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .figure .detail { color: var(--muted); font-size: 12px; }
  .table-wrap { overflow-x: auto; margin: 10px 0; }
  .table-title { font-weight: 600; margin: 12px 0 4px; }
  .table-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .table-head .table-title { margin: 0; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tool { font: 12px inherit; padding: 3px 10px; border: 1px solid var(--line); border-radius: 5px;
          background: transparent; color: var(--accent); cursor: pointer; white-space: nowrap; }
  .tool:hover { border-color: var(--accent); }
  html.incognito .tool { border-radius: 0; font-family: var(--mono); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; }
  tr.total td { font-weight: 600; background: var(--total); }
  .neg { color: var(--neg); }
  .note { color: var(--muted); margin: 8px 0 0; font-size: 13px; }
  .note.warning { background: var(--warn-bg); color: var(--warn); padding: 6px 10px; border-radius: 6px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
         padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .bar form { max-width: 1100px; margin: 0 auto; display: flex; gap: 8px; }
  .bar input[type=text] { flex: 1; font: 15px var(--mono); padding: 10px 12px; border: 1px solid var(--line);
                          border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
  .bar button { padding: 0 16px; border: 0; border-radius: 6px; background: var(--accent); color: var(--panel); font-weight: 600; }
  .hint { max-width: 1100px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
  .busy { color: var(--muted); font-style: italic; }
  .section { margin: 18px 0 4px; padding-top: 10px; border-top: 1px solid var(--line); }
  .section:first-of-type { border-top: 0; padding-top: 0; }
  .section h3 { font-size: 14px; margin: 0; }
  .section .cmd { font-size: 12px; margin: 2px 0 0; }
  a { color: var(--accent); }
  header .right { display: flex; gap: 14px; align-items: baseline; }
  .toggle { font: 12px var(--mono); background: none; border: 1px solid var(--line); color: var(--muted);
            border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  .prompt { display: none; }

  /* Incognito: a crisp white-on-black terminal. */
  html.incognito {
    --bg: #0c0c0c; --panel: #0c0c0c; --text: #f2f2f2; --muted: #a0a0a0; --line: #5a5a5a; --accent: #ffffff;
    --neg: #ff6b6b; --warn-bg: #f2f2f2; --warn: #0c0c0c; --total: #1e1e1e;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; color-scheme: dark;
  }
  html.incognito body { font: 15px/1.5 var(--mono); -webkit-font-smoothing: antialiased; }
  html.incognito header { border-bottom: 3px double var(--line); }
  html.incognito header h1 { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
  html.incognito header h1::after { content: " :: finance terminal"; font-weight: normal; font-size: 13px; color: var(--muted); }
  html.incognito .card, html.incognito .figure, html.incognito .bar input[type=text], html.incognito .toggle,
  html.incognito .bar button, html.incognito .note.warning { border-radius: 0; }
  html.incognito .card { border: 3px double var(--line); }
  html.incognito .card h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
  html.incognito .card h2::before { content: "▌ "; }
  html.incognito .figure { border: 1px dashed var(--line); }
  html.incognito .figure .label, html.incognito th { text-transform: uppercase; letter-spacing: .5px; font-weight: normal; }
  html.incognito .figure .label, html.incognito .figure .detail, html.incognito th, html.incognito .note { font-size: 12px; }
  html.incognito .figure .value { font-size: 22px; }
  html.incognito th, html.incognito td { border-bottom: 1px dotted var(--line); padding: 3px 10px; }
  html.incognito tr.total td { border-top: 1px solid var(--text); border-bottom: 3px double var(--text); }
  html.incognito .table-title { font-weight: normal; text-transform: uppercase; letter-spacing: .5px; margin-top: 18px; }
  html.incognito .table-title::before { content: "── "; color: var(--muted); }
  html.incognito .note.warning::before { content: "!! "; }
  html.incognito .cmd { color: var(--text); }
  html.incognito .cmd::before { content: "C:\\ILA> "; color: var(--muted); }
  html.incognito .busy { font-style: normal; }
  html.incognito .busy::after { content: "█"; animation: blink 1s steps(1) infinite; }
  html.incognito .bar { border-top: 3px double var(--line); }
  html.incognito .bar form { align-items: center; }
  html.incognito .prompt { display: inline; color: var(--muted); }
  html.incognito .bar input[type=text] { border: 0; background: transparent; caret-color: var(--text); outline: none; padding: 6px 4px; }
  html.incognito .bar input::placeholder { color: var(--line); }
  html.incognito .bar button { background: var(--text); color: var(--bg); font: bold 14px var(--mono); padding: 5px 12px; }
  html.incognito .bar button::before { content: "["; } html.incognito .bar button::after { content: "]"; }
  html.incognito ::selection { background: var(--text); color: var(--bg); }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { html.incognito .busy::after { animation: none; } }
  /* Navigation and the builder pages. */
  header nav { display: flex; gap: 14px; align-items: baseline; }
  header nav a.current { color: var(--text); text-decoration: none; font-weight: 600; }
  .page { max-width: 1100px; margin: 0 auto; padding: 16px 20px 60px; }
  .page h2 { font-size: 15px; margin: 22px 0 8px; }
  .page h2:first-child { margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .tpl h3 { font-size: 15px; margin: 0 0 4px; font-family: var(--mono); }
  .tpl ul { margin: 8px 0 12px; padding-left: 18px; color: var(--muted); }
  .tpl.unavailable { border-style: dashed; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line);
           color: var(--muted); margin-left: 6px; vertical-align: middle; font-family: system-ui, sans-serif; }
  .badge.on { color: var(--accent); border-color: var(--accent); }
  .btn { display: inline-block; padding: 7px 14px; border: 0; border-radius: 6px; background: var(--accent);
         color: var(--panel); font: 600 13px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  .btn.quiet { background: none; color: var(--accent); border: 1px solid var(--line); }
  .btn.danger { background: var(--neg); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .mono { font-family: var(--mono); }
  td.wrap { white-space: normal; }
  form.edit label { display: block; font-weight: 600; margin: 14px 0 4px; }
  form.edit input[type=text], form.edit textarea { width: 100%; font: 14px var(--mono); padding: 8px 10px;
         border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  form.edit .help { color: var(--muted); font-size: 12px; margin-top: 3px; }
  form.edit .errors { color: var(--neg); font-size: 13px; margin: 4px 0 0; padding: 0; list-style: none; }
  form.edit .check label { display: inline; font-weight: normal; }
  .explain { color: var(--muted); font-size: 13px; }
  .explain code, .sub code { font-family: var(--mono); }
  html.incognito .btn, html.incognito .badge, html.incognito form.edit input[type=text],
  html.incognito form.edit textarea { border-radius: 0; font-family: var(--mono); }
  html.incognito .btn { background: var(--text); color: var(--bg); }
  html.incognito .btn.quiet { background: none; color: var(--text); }
  html.incognito .tpl { border: 3px double var(--line); }
  html.incognito .tpl.unavailable { border: 1px dashed var(--line); }
  html.incognito .page h2 { text-transform: uppercase; letter-spacing: 1px; font-size: 14px; }
  html.incognito .page h2::before { content: "── "; color: var(--muted); }
</style>
<script>
  try { if (localStorage.getItem("ila-theme") === "incognito") document.documentElement.classList.add("incognito"); } catch (e) {}
</script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const button = document.getElementById("theme");
    if (!button) return;
    const show = () => {
      const on = document.documentElement.classList.contains("incognito");
      button.setAttribute("aria-pressed", on);
      button.textContent = on ? "Standard" : "Incognito";
    };
    button.addEventListener("click", () => {
      const on = document.documentElement.classList.toggle("incognito");
      try { localStorage.setItem("ila-theme", on ? "incognito" : "standard"); } catch (e) {}
      show();
      const input = document.getElementById("input");
      if (input) input.focus();
    });
    show();
  });
</script>
