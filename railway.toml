# Railway config-as-code: https://docs.railway.com/reference/config-as-code

[deploy]
# Runs once per deploy, before the new version takes traffic; a failure aborts the deploy.
preDeployCommand = ["python manage.py migrate --noinput"]
startCommand = "python manage.py collectstatic --noinput && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --access-logfile -"
healthcheckPath = "/healthz/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
